<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <style>
      .setup-steps {
        margin: 0 0 16px;
        padding-left: 20px;
      }
      .setup-steps li {
        margin-bottom: 10px;
        line-height: 1.4;
      }
      .setup-link {
        display: inline-block;
        margin-top: 4px;
        word-break: break-all;
      }
      .copy-row {
        display: flex;
        gap: 10px;
        margin-top: 6px;
      }
      .copy-row .homey-form-input {
        flex-grow: 1;
        min-width: 0;
        font-family: monospace;
      }
      .problem {
        margin-bottom: 14px;
      }
      .problem-title {
        font-weight: 600;
        margin: 0 0 4px;
      }
      .health-list {
        margin: 0 0 12px;
        padding-left: 0;
        list-style: none;
      }
      .health-list li {
        margin-bottom: 8px;
        line-height: 1.4;
      }
      .health-error {
        color: #c0392b;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <header class="homey-header">
      <h1 class="homey-title" data-i18n="settings.title"></h1>
    </header>

    <!-- Client ID setup -->
    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.subtitle"></legend>
      <p class="homey-form-hint" data-i18n="settings.bodytext"></p>
      <ol class="setup-steps">
        <li>
          <span data-i18n="settings.steps.portal"></span><br />
          <a id="portalLink" class="setup-link" href="https://app.developer.viessmann-climatesolutions.com/" target="_blank" rel="noopener">app.developer.viessmann-climatesolutions.com</a>
        </li>
        <li data-i18n="settings.steps.client"></li>
        <li><strong data-i18n="settings.steps.recaptcha"></strong></li>
        <li>
          <span data-i18n="settings.steps.redirect"></span>
          <div class="copy-row">
            <input class="homey-form-input" id="redirectUri" type="text" value="https://callback.athom.com/oauth2/callback" readonly />
            <button id="copyRedirectUri" class="homey-button-secondary" data-i18n="settings.steps.copy"></button>
          </div>
        </li>
        <li data-i18n="settings.steps.client_id"></li>
        <li data-i18n="settings.steps.pair"></li>
      </ol>
      <div class="homey-form-group">
        <label class="homey-form-label" for="clientId" data-i18n="settings.client_id_label">Viessmann Client ID</label>
        <input class="homey-form-input" id="clientId" type="text" value="" />
      </div>
      <div class="homey-form-buttons">
        <button id="save" class="homey-button-primary-full" data-i18n="settings.save"></button>
      </div>
    </fieldset>

    <!-- Separator -->
    <div class="homey-form-group-separator"></div>

    <!-- The optional extra devices: who needs them and what they cost in API calls -->
    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.extra_devices.title"></legend>
      <p class="homey-form-hint" data-i18n="settings.extra_devices.text"></p>
    </fieldset>

    <!-- Separator -->
    <div class="homey-form-group-separator"></div>

    <!-- Health: API calls per Viessmann login, last update and last error per device (also the
         extra devices that make calls of their own) -->
    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.health.title"></legend>
      <p class="homey-form-hint" data-i18n="settings.health.description"></p>
      <ul class="health-list" id="healthAccounts"></ul>
      <ul class="health-list" id="healthDevices"></ul>
      <div class="homey-form-buttons">
        <button id="refreshHealth" class="homey-button-secondary" data-i18n="settings.health.refresh"></button>
      </div>
    </fieldset>

    <!-- Separator -->
    <div class="homey-form-group-separator"></div>

    <!-- Common problems -->
    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.problems.title"></legend>
      <div class="problem">
        <p class="problem-title" data-i18n="settings.problems.redirect.title"></p>
        <p class="homey-form-hint" data-i18n="settings.problems.redirect.fix"></p>
      </div>
      <div class="problem">
        <p class="problem-title" data-i18n="settings.problems.no_devices.title"></p>
        <p class="homey-form-hint" data-i18n="settings.problems.no_devices.fix"></p>
      </div>
      <div class="problem">
        <p class="problem-title" data-i18n="settings.problems.no_oauth2_client.title"></p>
        <p class="homey-form-hint" data-i18n="settings.problems.no_oauth2_client.fix"></p>
      </div>
      <div class="problem">
        <p class="problem-title" data-i18n="settings.problems.reauth.title"></p>
        <p class="homey-form-hint" data-i18n="settings.problems.reauth.fix"></p>
      </div>
      <p class="homey-form-hint" data-i18n="settings.problems.report"></p>
    </fieldset>

    <!-- Separator -->
    <div class="homey-form-group-separator"></div>

    <!-- Troubleshooting Section -->
    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.troubleshooting.title"></legend>
      <p class="homey-form-hint" data-i18n="settings.troubleshooting.description"></p>

      <!-- Report for the developer: installations and every device's features in one step -->
      <div class="homey-form-group">
        <label class="homey-form-label" for="report" data-i18n="settings.report.title"></label>
        <p class="homey-form-hint" data-i18n="settings.report.description"></p>
        <div class="homey-form-buttons">
          <button id="prepareReport" class="homey-button-primary" data-i18n="settings.report.prepare"></button>
          <button id="copyReport" class="homey-button-secondary" data-i18n="settings.report.copy"></button>
        </div>
        <p class="homey-form-hint" id="reportHowToSend" style="display: none;"></p>
        <textarea class="homey-form-textarea" id="report" rows="10" readonly></textarea>
      </div>
    </fieldset>

    <script type="text/javascript">
      // a method named 'onHomeyReady' must be present in your code
      function onHomeyReady(Homey) {
        var clientIdElement = document.getElementById("clientId");
        var saveElement = document.getElementById("save");
        var portalLinkElement = document.getElementById("portalLink");
        var redirectUriElement = document.getElementById("redirectUri");
        var copyRedirectUriElement = document.getElementById("copyRedirectUri");
        var healthAccountsElement = document.getElementById("healthAccounts");
        var healthDevicesElement = document.getElementById("healthDevices");
        var refreshHealthElement = document.getElementById("refreshHealth");
        var prepareReportElement = document.getElementById("prepareReport");
        var copyReportElement = document.getElementById("copyReport");
        var reportElement = document.getElementById("report");
        var reportHowToSendElement = document.getElementById("reportHowToSend");

        // A translated text with __tag__ placeholders filled in
        function t(key, tags) {
          var text = Homey.__(key) || key;
          Object.keys(tags || {}).forEach(function (tag) {
            text = text.split("__" + tag + "__").join(String(tags[tag]));
          });
          return text;
        }

        function timeText(value) {
          return value ? new Date(value).toLocaleString([], { dateStyle: "short", timeStyle: "short" }) : "";
        }

        function addItem(list, text, className) {
          var item = document.createElement("li");
          item.textContent = text;
          if (className) item.className = className;
          list.appendChild(item);
          return item;
        }

        function showHealth(health) {
          healthAccountsElement.textContent = "";
          healthDevicesElement.textContent = "";
          var resetsAt = new Date(health.resetsAt).toLocaleTimeString([], { timeStyle: "short" });
          health.accounts.forEach(function (account) {
            addItem(healthAccountsElement, t("settings.health.account", {
              account: account.account, used: account.usedToday, limit: health.limit, planned: account.plannedPerDay, time: resetsAt,
            }));
          });
          if (health.devices.length === 0) addItem(healthDevicesElement, t("settings.health.no_devices"));
          health.devices.forEach(function (device) {
            var item = addItem(healthDevicesElement, t("settings.health.device", {
              name: device.name, minutes: device.intervalMinutes, account: device.account,
            }));
            var update = device.lastUpdateAt
              ? t("settings.health.last_update", { time: timeText(device.lastUpdateAt) })
              : t("settings.health.no_update");
            item.appendChild(document.createElement("br"));
            item.appendChild(document.createTextNode(update));
            if (device.lastError) {
              var error = document.createElement("span");
              error.className = "health-error";
              error.textContent = t("settings.health.last_error", { time: timeText(device.lastError.at), message: device.lastError.message });
              item.appendChild(document.createElement("br"));
              item.appendChild(error);
            }
          });
        }

        function loadHealth() {
          Homey.api("GET", "/health", null, function (err, result) {
            if (err) return Homey.alert(err);
            showHealth(result);
          });
        }

        refreshHealthElement.addEventListener("click", loadHealth);
        loadHealth();

        prepareReportElement.addEventListener("click", function (e) {
          prepareReportElement.disabled = true;
          Homey.api("POST", "/report", {}, function (err, result) {
            prepareReportElement.disabled = false;
            if (err) return Homey.alert(err);
            reportElement.value = JSON.stringify(result.report, null, 2);
            reportHowToSendElement.textContent = t("settings.report.how_to_send", { lines: result.summaryLines });
            reportHowToSendElement.style.display = "block";
          });
        });

        copyReportElement.addEventListener("click", function (e) {
          reportElement.select();
          document.execCommand("copy");
        });

        Homey.get("clientId", function (err, clientId) {
          if (err) return Homey.alert(err);
          clientIdElement.value = clientId;
        });

        saveElement.addEventListener("click", function (e) {
          const clientId = clientIdElement.value.trim();

          if (!clientId || clientId.length < 5) {
            return Homey.alert(Homey.__("settings.error.invalid_client_id"));
          }

          Homey.set("clientId", clientId, function (err) {
            if (err) return Homey.alert(err);
            Homey.alert(Homey.__("settings.saved"));
          });
        });

        // Open the developer portal in the system browser; fall back to the plain link
        portalLinkElement.addEventListener("click", function (e) {
          if (typeof Homey.openURL !== "function") return;
          e.preventDefault();
          Promise.resolve(Homey.openURL(portalLinkElement.href)).catch(function () {
            window.open(portalLinkElement.href, "_blank");
          });
        });

        // Copy the redirect URI. The Clipboard API is not available in every Homey
        // web view, so fall back to selecting the text and using execCommand.
        copyRedirectUriElement.addEventListener("click", function (e) {
          var text = redirectUriElement.value;

          function showCopied() {
            copyRedirectUriElement.textContent = Homey.__("settings.steps.copied");
            setTimeout(function () {
              copyRedirectUriElement.textContent = Homey.__("settings.steps.copy");
            }, 2000);
          }

          function copyBySelection() {
            redirectUriElement.focus();
            redirectUriElement.select();
            redirectUriElement.setSelectionRange(0, text.length);
            var copied = false;
            try {
              copied = document.execCommand("copy");
            } catch (err) {
              copied = false;
            }
            // If copying failed, the text stays selected so the user can copy it by hand
            if (copied) showCopied();
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(showCopied, copyBySelection);
          } else {
            copyBySelection();
          }
        });

        Homey.ready();
      }
    </script>
  </body>
</html>
