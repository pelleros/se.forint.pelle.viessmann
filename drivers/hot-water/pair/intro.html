<!-- The first view of an extra device (heating circuit, hot water, room): who needs it and what it
     shares with the ViCare device. The same file in every extra driver; the texts come from the
     driver (extraDriver.js → introTexts). -->
<style>
  .extra-intro p { margin: 0 0 14px; line-height: 1.45; }
</style>

<div class="extra-intro" id="paragraphs"></div>
<button id="next" class="homey-button-primary-full" style="display: none;"></button>

<script type="text/javascript">
  (function () {
    var next = document.getElementById("next");
    next.addEventListener("click", function () { Homey.nextView(); });
    Homey.emit("extra_intro")
      .then(function (texts) {
        Homey.setTitle(texts.title);
        texts.paragraphs.forEach(function (text) {
          var paragraph = document.createElement("p");
          paragraph.textContent = text;
          document.getElementById("paragraphs").appendChild(paragraph);
        });
        next.textContent = texts.next;
        next.style.display = "block";
      })
      .catch(function (err) {
        Homey.alert(err && err.message ? err.message : String(err));
      });
  })();
</script>
